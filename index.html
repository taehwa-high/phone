<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>남우혜 핸드폰</title>
<link rel="stylesheet" href="style.css?v=11032500">
</head>
<body>
<div id="phone">
  <i class="sb action"></i><i class="sb volup"></i><i class="sb voldn"></i>
  <button class="sb power" id="power" aria-label="화면 켜기/끄기"></button>
  <div id="screen" class="st-lock">
    <div id="wall"></div>

    <section id="lock" class="layer">
      <div class="lk-date">10월 31일 월요일</div>
      <div class="lk-time">8:00</div>
      <button class="lk-btn l" aria-label="손전등"><svg viewBox="0 0 24 24"><path d="M8 2h8v4l-2 3v2h-4V9L8 6V2zm2 11h4v9h-4z" fill="#fff"/></svg></button>
      <button class="lk-btn r" aria-label="카메라"><svg viewBox="0 0 24 24"><path d="M9 5l-1.5 2H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-2.500L15 5H9zm3 4a4.500 4.500 0 110 9 4.500 4.500 0 010-9z" fill="#fff"/></svg></button>
      <div class="lk-noti hidden" id="lkNoti"><i><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0110 0v3h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1h1zm2 0h6V7a3 3 0 00-6 0v3z" fill="#fff"/></svg></i><div><b>보안<em>방금</em></b><strong>잠금 해제 시도 실패</strong><span id="lkNotiTxt"></span></div></div>
      <div class="lk-hint">위로 쓸어올려서 열기</div>
    </section>

    <section id="pass" class="layer hidden">
      <div class="pw-title" id="pwTitle">암호 입력</div>
      <div class="pw-dots" id="pwDots"></div>
      <input id="pwText" class="pw-text hidden" type="password" autocomplete="off" aria-label="암호">
      <div class="pw-pad" id="pwPad"></div>
      <div class="pw-foot"><span>긴급</span><button id="pwCancel">취소</button></div>
      <div class="pw-out"><div class="po-date">10월 31일 월요일</div><div class="po-time" id="poTime">8:00</div><div class="po-msg"><b>iPhone을(를)<br>사용할 수 없음</b><span>1분 후에 다시 시도하십시오.</span><small>support.nokcha.com/passcode</small></div><div class="po-foot"><span>긴급통화</span><button id="poForgot">암호를 잊어버렸습니까?</button></div><div class="po-alert hidden" id="poAlert"><div><b>암호 힌트</b><p>남우선</p></div><button id="poOk">확인</button></div></div>
    </section>

    <section id="home" class="layer hidden"></section>
    <section id="app" class="layer hidden"></section>

    <div id="status"><span class="sl" id="sl">8:00</span><span class="sr"><em id="nosvc">서비스 없음</em>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.500" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="5" height="9" rx="1.800" fill="currentColor"/><path d="M24 4.500v4c.8-.3 1.500-1.100 1.500-2s-.7-1.700-1.500-2z" fill="currentColor" opacity=".45"/></svg></span></div>
    <div id="island"></div>
    <div id="hind"></div>
  </div>
</div>
<script src="app.js?v=11032500"></script>
</body>
</html>
